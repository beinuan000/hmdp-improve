server:
  port: 8081

spring:
  application:
    name: hmdp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: hmdp
    password: Hmdp123

  redis:
    host: 127.0.0.1
    port: 6380
    password: Redis123
    database: 0

  rabbitmq:
    host: 127.0.0.1
    port: 5673
    username: hmdp
    password: Rabbit123
    virtual-host: /

    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

  mybatis-plus:
    type-aliases-package: com.hmdp.entity

  logging:
    level:
      com.hmdp: debug